name: Local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/harness.py init
      - run: python scripts/harness.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public.py
